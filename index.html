<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>蟻后：地下帝國 v0.9</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090806;color:#eee4cf;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}#app{max-width:1050px;margin:auto;min-height:100vh;background:#120e0a}.hud{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;gap:8px;padding:8px;background:#100d09ee;border-bottom:1px solid #51422d;font-size:12px}.stats{display:flex;gap:9px;flex-wrap:wrap}.world{height:360px;position:relative;overflow:hidden;background:linear-gradient(#344a30 0 29%,#503921 29%,#21160f 100%)}canvas{width:100%;height:100%;display:block}.spawn{position:absolute;font-size:29px;cursor:pointer;filter:drop-shadow(0 3px 3px #0009);animation:bob 1.8s ease-in-out infinite;touch-action:manipulation}@keyframes bob{50%{transform:translateY(-5px)}}.card{margin:9px;padding:11px;border:1px solid #4d3e2a;background:#1b1610;border-radius:13px}.muted{font-size:11px;color:#b5a58a}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}button{min-height:42px;border:1px solid #5b4932;background:#292117;color:#eee4cf;border-radius:10px;padding:8px;font-weight:650}button:disabled{opacity:.35}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:9px}.hidden{display:none!important}.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.branch{background:#15110c;border:1px solid #403522;border-radius:11px;padding:7px}.branch h3{font-size:13px;margin:2px 0 6px}.node{width:100%;text-align:left;margin:4px 0;font-size:11px}.owned{background:#40341f;border-color:#c5a75c}.enc{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:25}.encbox{width:min(92%,470px);background:#19130d;border:1px solid #806440;border-radius:16px;padding:15px;text-align:center}.encicon{font-size:56px}.partner,.hero,.log{border:1px solid #4a3b27;border-radius:10px;padding:8px;margin-top:7px;background:#15110c}.bar{height:7px;background:#30271c;border-radius:9px;overflow:hidden;margin-top:5px}.fill{height:100%;background:#bda15b}.battle{position:absolute;inset:0;background:#0b0907f5;z-index:22;padding:10px;display:flex;flex-direction:column}.battlefield{position:relative;flex:1;border:1px solid #5a472f;border-radius:12px;overflow:hidden;background:linear-gradient(#263422,#34261a)}.unit{position:absolute;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold}.friend{background:#1d120b;border:1px solid #c59d58}.enemy{background:#541d18;border:1px solid #e58a70}.shot{position:absolute;width:5px;height:5px;border-radius:50%;background:#ddd;transform:translate(-50%,-50%)}.hp{position:absolute;height:3px;background:#2a2119;width:22px;top:-6px;left:50%;transform:translateX(-50%)}.hp i{display:block;height:100%;background:#c3aa67}.battlehud{display:flex;gap:7px;align-items:center;padding:6px 0;font-size:11px}.loot{font-size:12px}.tag{display:inline-block;border:1px solid #5a4931;border-radius:12px;padding:2px 6px;margin:2px;font-size:10px}.buy{width:100%;font-size:14px}@media(max-width:700px){.world{height:335px}.tree{grid-template-columns:1fr 1fr}.hud{font-size:10px}.tabs{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div id="app">
<div class="hud"><div class="stats"><span>🐜 <b id="w">35</b></span><span>🛡️ <b id="s">10</b></span><span>🏹 <b id="r">0</b></span><span>🩹 <b id="m">0</b></span><span>🍄 <b id="f">100</b></span><span>🔬 <b id="tp">3</b> TP</span></div><b id="day">Day 1</b></div>
<div class="world"><canvas id="cv"></canvas><div id="spawns"></div><div style="position:absolute;left:8px;bottom:8px;background:#15110cdd;border:1px solid #57452f;border-radius:8px;padding:6px;font-size:11px">探索 → 戰鬥 → 戰利品/科技點 → 強化</div>
<div id="enc" class="enc hidden"><div class="encbox"><div id="eicon" class="encicon"></div><h3 id="ename"></h3><div id="edesc" class="muted"></div><div id="ereward" class="loot" style="margin:9px"></div><div class="row"><button id="fight" class="grow">⚔️ 出戰</button><button id="ally" class="grow">🤝 共生</button><button id="leave">離開</button></div></div></div>

<div class="tabs"><button data-tab="colony">蟻群</button><button data-tab="tech">科技</button><button data-tab="army">軍隊</button><button data-tab="sym">共生</button><button data-tab="hero">老兵</button></div>
<section id="colony" class="card"><b>殖民地</b><div id="event" class="log">地表有獵物活動。</div><button id="boost" class="buy" style="margin-top:9px">🍄 20 → 快速培育 +10</button><div class="row" style="margin-top:9px"><div class="grow">兵蟻出生比例 <b id="ratioTxt">20%</b><input id="ratio" type="range" min="5" max="60" value="20" style="width:100%;accent-color:#b99c55"></div><button id="pause">暫停</button><button id="speed">×2</button></div></section>
<section id="tech" class="card hidden"><div class="row"><div class="grow"><b>科技樹</b><div class="muted">戰鬥勝利是 TP 主要來源。技能可改變兵種、AOE、回血、射程與戰術。</div></div><b>🔬 <span id="tp2">3</span> TP</b></div><div id="tree" class="tree" style="margin-top:8px"></div></section>
<section id="army" class="card hidden"><b>軍隊編制</b><div id="armyInfo"></div></section>
<section id="sym" class="card hidden"><b>共生與仿生</b><div class="muted">收服生物可解鎖其專屬科技；擊殺 Boss 也可能取得仿生樣本。</div><div id="partners"></div></section>
<section id="hero" class="card hidden"><b>老兵與特殊個體</b><div class="muted">實際擊殺取得 XP；存活越久越強。</div><div id="heroes"></div></section>
</div>
<script>
(()=>{const $=x=>document.getElementById(x),cv=$('cv'),ctx=cv.getContext('2d'),field=$('field');
let S={w:35,s:10,r:0,m:0,f:100,tp:3,day:1,t:0,ratio:.2,boost:20,paused:false,spd:1,skills:new Set(),partners:{},samples:{},heroes:[{name:'黑顎',lv:1,xp:0,k:0}],current:null,battle:null,marks:new Set(),ants:[]};
const enemies={
roach:{icon:'🪳',name:'蟑螂',hp:150,atk:7,n:2,tp:1,food:18,desc:'快速、數量少的基礎獵物。'},
spider:{icon:'🕷️',name:'獵蛛',hp:240,atk:11,n:2,tp:2,food:28,desc:'高傷害獵食者。擊敗後可能取得蛛網樣本。',sample:'spider'},
mantis:{icon:'🦗',name:'螳螂',hp:360,atk:15,n:1,tp:3,food:36,desc:'精英掠食者。鐮刀前足能造成致命斬擊。',sample:'mantis'},
beetle:{icon:'🪲',name:'重甲甲蟲',hp:300,atk:8,n:2,tp:2,food:32,armor:.35,desc:'甲殼極厚，需要破甲或持續輸出。',sample:'beetle'},
centipede:{icon:'🐉',name:'巨型蜈蚣',hp:650,atk:20,n:1,tp:6,food:70,boss:true,desc:'區域 Boss。高生命、高傷害，會週期性橫掃蟻群。',sample:'centipede'}
};
const tech=[
['bite','⚔️ 近戰','強化巨顎',1,'','近戰傷害 +25%'],['cleave','⚔️ 近戰','群體撕咬',2,'bite','近戰攻擊會波及附近敵人'],['execute','⚔️ 近戰','處刑顎',3,'cleave','對低生命敵人造成額外傷害'],['berserk','⚔️ 近戰','狂暴費洛蒙',3,'bite','低血量時攻速提高'],
['acid','🏹 遠程','酸液兵',2,'','解鎖遠程兵種'],['range2','🏹 遠程','高壓噴射',2,'acid','射程 +35%'],['splash','🏹 遠程','酸液爆裂',3,'acid','遠程攻擊造成範圍傷害'],['corrode','🏹 遠程','腐蝕甲殼',3,'splash','命中降低敵人護甲'],
['medic','🩹 生存','醫護工蟻',2,'','解鎖醫護蟻'],['regen','🩹 生存','費洛蒙癒合',2,'medic','全軍緩慢回血'],['triage','🩹 生存','戰場救援',3,'medic','醫護蟻優先治療瀕死單位'],['revive','🩹 生存','緊急復甦',5,'triage','每場戰鬥首次致死有機率救回'],
['armor','🛡️ 防禦','硬化外骨骼',1,'','全軍生命 +20%'],['guard','🛡️ 防禦','護衛兵',2,'armor','前排承受更多敵方攻擊'],['thorns','🛡️ 防禦','反咬',3,'guard','受到近戰攻擊時反傷'],['fort','🛡️ 防禦','活體城牆',4,'guard','前排減傷並保護遠程兵'],
['focus','🧠 戰術','獵物標記',1,'','優先集火低血量敵人'],['surround','🧠 戰術','包圍',2,'focus','近戰數量優勢提高傷害'],['retreat','🧠 戰術','傷兵撤退',2,'focus','低血量單位向後撤離'],['warxp','🧠 戰術','戰鬥學習',3,'surround','老兵 XP +50%'],
['brood','👑 繁殖','戰時育幼',1,'','快速培育 +5 額外新生蟻'],['cheap','👑 繁殖','營養循環',2,'brood','快速培育成本成長降低'],['soldier','👑 繁殖','軍事育幼',2,'brood','快速培育兵蟻比例提高'],['elite','👑 繁殖','精英幼體',4,'soldier','新兵基礎生命提高'],
['scythe','🦠 仿生','鐮刀斬',3,'@mantis','螳螂：近戰偶發高倍率斬擊'],['web','🦠 仿生','蛛網束縛',3,'@spider','蜘蛛：敵人移動與攻速降低'],['shell','🦠 仿生','甲殼陣',3,'@beetle','甲蟲：前排額外減傷'],['venom','🦠 仿生','神經毒',5,'@centipede','蜈蚣：攻擊附加持續毒傷'],
['aoe2','☣️ 禁忌','連鎖腺體',5,'splash','AOE 可二次擴散'],['blood','☣️ 禁忌','血肉回收',4,'regen','擊殺敵人時全軍回血'],['giant','☣️ 禁忌','巨型兵蟻',5,'armor','少量兵蟻巨大化，生命與傷害提升'],['memory','☣️ 禁忌','戰鬥記憶遺傳',6,'warxp','新兵繼承部分老兵經驗']
];
function msg(x){$('event').textContent=x}
function unlocked(k){if(!k[4])return true;if(k[4][0]=='@'){let q=k[4].slice(1);return (S.partners[q]||0)>0||(S.samples[q]||0)>=3}return S.skills.has(k[4])}
function can(k){return !S.skills.has(k[0])&&S.tp>=k[3]&&unlocked(k)}
function buildTree(){let g={};tech.forEach(k=>(g[k[1]]??=[]).push(k));$('tree').innerHTML=Object.entries(g).map(([b,a])=>`<div class="branch"><h3>${b}</h3>${a.map(k=>`<button id="k${k[0]}" class="node"><b>${k[2]}</b> · ${k[3]} TP<br><span class="muted">${k[5]}</span></button>`).join('')}</div>`).join('');tech.forEach(k=>$('k'+k[0]).onclick=()=>{if(!can(k))return;S.tp-=k[3];S.skills.add(k[0]);if(k[0]=='acid')S.r=Math.max(S.r,3);if(k[0]=='medic')S.m=Math.max(S.m,2);msg('🔬 科技完成：'+k[2]);ui()})}
function spawn(){if($('spawns').children.length>7||S.battle)return;let e=document.createElement('div');e.className='spawn';let keys=Object.keys(enemies),key=Math.random()<.08?'centipede':keys[Math.floor(Math.random()*4)],o=enemies[key];e.textContent=o.icon;e.style.left=5+Math.random()*88+'%';e.style.top=5+Math.random()*18+'%';$('spawns').appendChild(e);e.onclick=()=>{S.current={key,o,e};$('eicon').textContent=o.icon;$('ename').textContent=o.name;$('edesc').textContent=o.desc;$('ereward').textContent=`勝利：+${o.tp} TP、+${o.food} 菌糧${o.sample?'、可能取得仿生樣本':''}`;$('enc').classList.remove('hidden')}}
function closeEnc(remove=false){if(remove&&S.current)S.current.e.remove();$('enc').classList.add('hidden')}
$('leave').onclick=()=>closeEnc(false);$('enc').onclick=e=>{if(e.target===$('enc'))closeEnc(false)}
$('ally').onclick=()=>{let {key,o}=S.current;if(Math.random()<(o.boss?.12:.35)){S.partners[key]=(S.partners[key]||0)+1;msg('🤝 成功建立 '+o.name+' 共生。專屬科技已解鎖。')}else msg('共生失敗，'+o.name+' 逃離。');closeEnc(true);ui()}
function makeUnit(side,type,x,y,hp,atk,range,speed){return {side,type,x,y,hp,max:hp,atk,range,speed,cd:Math.random(),dead:false}}
function startBattle(){let {key,o}=S.current;closeEnc(true);let u=[];let melee=Math.min(26,S.s),ranged=S.skills.has('acid')?Math.min(14,Math.max(S.r,Math.floor(S.s*.25))):0,med=S.skills.has('medic')?Math.min(6,Math.max(S.m,2)):0;for(let i=0;i<melee;i++)u.push(makeUnit('f','m',12+Math.random()*20,18+Math.random()*64,22*(S.skills.has('armor')?1.2:1)*(S.skills.has('elite')?1.12:1),5*(S.skills.has('bite')?1.25:1),7,12));for(let i=0;i<ranged;i++)u.push(makeUnit('f','r',8+Math.random()*14,15+Math.random()*70,14,4,S.skills.has('range2')?36:27,9));for(let i=0;i<med;i++)u.push(makeUnit('f','h',8+Math.random()*12,20+Math.random()*60,13,0,24,8));for(let i=0;i<o.n;i++)u.push(makeUnit('e','e',76+Math.random()*15,25+i*45,o.hp,o.atk,8,o.boss?6:9));S.battle={key,o,u,time:0,shots:[],tick:0};$('bname').textContent='⚔️ '+o.name;$('battle').classList.remove('hidden');renderBattle()}
$('fight').onclick=startBattle;
$('retreat').onclick=()=>{if(!S.battle)return;let loss=Math.min(S.s,Math.ceil(S.battle.u.filter(x=>x.side=='f'&&!x.dead).length*.08));S.s=Math.max(1,S.s-loss);msg('撤退成功，但損失 '+loss+' 隻兵蟻。');S.battle=null;$('battle').classList.add('hidden');ui()}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearest(a,arr){let q=null,d=1e9;arr.forEach(b=>{let x=dist(a,b);if(x<d){d=x;q=b}});return [q,d]}
function battleStep(){let B=S.battle;if(!B||S.paused)return;let dt=.12*S.spd;B.time+=dt;let friends=B.u.filter(x=>x.side=='f'&&!x.dead),foes=B.u.filter(x=>x.side=='e'&&!x.dead);if(!foes.length)return win();if(!friends.filter(x=>x.type!='h').length)return lose();B.u.forEach(a=>{if(a.dead)return;a.cd-=dt;if(a.type=='h'){let hurt=friends.filter(x=>x!==a&&x.hp<x.max*.9);if(hurt.length){hurt.sort((x,y)=>(x.hp/x.max)-(y.hp/y.max));let t=hurt[0],[q,d]=nearest(a,[t]);if(d>18){a.x+=(t.x-a.x)/d*a.speed*dt;a.y+=(t.y-a.y)/d*a.speed*dt}else if(a.cd<=0){t.hp=Math.min(t.max,t.hp+5);a.cd=.8}}return}let targets=a.side=='f'?foes:friends.filter(x=>x.type!='h'||friends.length<3);if(!targets.length)return;if(S.skills.has('focus')&&a.side=='f')targets.sort((x,y)=>(x.hp/x.max)-(y.hp/y.max));let [t,d]=nearest(a,targets),desired=a.range;if(d>desired){a.x+=(t.x-a.x)/d*a.speed*dt;a.y+=(t.y-a.y)/d*a.speed*dt}else if(a.cd<=0){let dmg=a.atk;if(a.side=='f'&&a.type=='m'){if(S.skills.has('surround'))dmg*=1.18;if(S.skills.has('scythe')&&Math.random()<.13)dmg*=3;if(S.skills.has('execute')&&t.hp<t.max*.3)dmg*=1.6}if(a.side=='f'&&a.type=='r'&&S.skills.has('splash')){foes.filter(z=>dist(z,t)<14).forEach(z=>z.hp-=dmg*.55)}if(a.side=='e'&&S.skills.has('shell'))dmg*=.82;if(t.side=='e'&&B.o.armor&&!S.skills.has('corrode'))dmg*=1-B.o.armor;t.hp-=dmg;if(a.type=='r')B.shots.push({x:a.x,y:a.y,tx:t.x,ty:t.y,life:.18});a.cd=a.type=='r'?.8:a.side=='e'?1.05:.65;if(S.skills.has('berserk')&&a.hp<a.max*.35)a.cd*=.65}}});if(S.skills.has('regen'))friends.forEach(a=>a.hp=Math.min(a.max,a.hp+.22*dt));if(S.skills.has('web'))foes.forEach(a=>a.cd+=.08*dt);B.u.forEach(a=>{if(a.hp<=0&&!a.dead){a.dead=true;if(a.side=='e'&&S.skills.has('blood'))friends.forEach(f=>f.hp=Math.min(f.max,f.hp+3))}});B.shots.forEach(q=>q.life-=dt);B.shots=B.shots.filter(q=>q.life>0);renderBattle()}
function win(){let B=S.battle,o=B.o;S.tp+=o.tp;S.f+=o.food;if(o.sample&&Math.random()<.75){S.samples[o.sample]=(S.samples[o.sample]||0)+1}let dead=B.u.filter(x=>x.side=='f'&&x.dead&&x.type!='h').length;S.s=Math.max(1,S.s-Math.ceil(dead*.65));let kills=o.n,xp=Math.round((8+o.tp*4)*(S.skills.has('warxp')?1.5:1));S.heroes[0].xp+=xp;S.heroes[0].k+=kills;S.heroes[0].lv=1+Math.floor(S.heroes[0].xp/30);msg(`🏆 勝利！+${o.tp} TP、+${o.food} 菌糧${o.sample?'；取得的 '+o.sample+' 樣本 '+(S.samples[o.sample]||0)+'/3':''}`);S.battle=null;$('battle').classList.add('hidden');ui()}
function lose(){let B=S.battle;let dead=B.u.filter(x=>x.side=='f'&&x.dead).length;S.s=Math.max(1,S.s-Math.max(2,Math.ceil(dead*.8)));msg('☠️ 狩獵隊潰敗。損失大量戰鬥蟻，沒有取得科技點。');S.battle=null;$('battle').classList.add('hidden');ui()}
function renderBattle(){let B=S.battle;if(!B)return;$('bt').textContent=B.time.toFixed(1);field.innerHTML='';B.u.filter(x=>!x.dead).forEach(a=>{let e=document.createElement('div');e.className='unit '+(a.side=='f'?'friend':'enemy');e.style.left=a.x+'%';e.style.top=a.y+'%';let size=a.side=='e'?(B.o.boss?28:20):(a.type=='m'?13:10);e.style.width=e.style.height=size+'px';e.textContent=a.type=='r'?'•':a.type=='h'?'+':'';let h=document.createElement('span');h.className='hp';h.innerHTML=`<i style="width:${Math.max(0,a.hp/a.max*100)}%"></i>`;e.appendChild(h);field.appendChild(e)});B.shots.forEach(q=>{let e=document.createElement('i');e.className='shot';e.style.left=q.tx+'%';e.style.top=q.ty+'%';field.appendChild(e)})}
function sim(){if(S.paused||S.battle)return;let d=.2*S.spd;S.t+=d;S.f+=S.w*.0018*d;if(S.t>15){S.t=0;S.day++;if(Math.random()<.9)spawn()}[[60,1],[150,1],[400,2]].forEach(([n,p])=>{if(S.w+S.s>=n&&!S.marks.has(n)){S.marks.add(n);S.tp+=p;msg('人口里程碑僅提供少量 +'+p+' TP；主要科技仍需靠戰鬥。')}});draw();ui()}
$('boost').onclick=()=>{let c=Math.floor(S.boost);if(S.f<c)return msg('菌糧不足。');S.f-=c;let n=S.skills.has('brood')?15:10,so=Math.round(n*(S.skills.has('soldier')?Math.min(.8,S.ratio+.2):S.ratio));S.s+=so;S.w+=n-so;S.boost*=S.skills.has('cheap')?1.20:1.36;msg('🥚 快速培育 '+n+' 隻，其中 '+so+' 隻為兵蟻。');ui()}
function draw(){let r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);let sx=r.width/900,sy=r.height/470;ctx.save();ctx.scale(sx,sy);ctx.strokeStyle='#765438';ctx.lineWidth=17;ctx.lineCap='round';[[450,135,450,240],[450,220,280,315],[450,220,620,315],[280,320,280,420],[620,315,620,420]].forEach(p=>{ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[2],p[3]);ctx.stroke()});[['育幼室',280,320,105,58],['菌圃',620,320,110,62],['王室',450,415,100,48]].forEach(q=>{ctx.fillStyle='#62472d';ctx.beginPath();ctx.ellipse(q[1],q[2],q[3],q[4],0,0,7);ctx.fill();ctx.fillStyle='#d0bea0';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText(q[0],q[1],q[2]-q[4]+18)});for(let i=0;i<Math.min(90,S.w+S.s);i++){ctx.fillStyle='#090604';ctx.beginPath();ctx.arc(180+(i*71+S.t*9)%540,250+(i*37)%175,i<S.s?4:2.5,0,7);ctx.fill()}ctx.restore()}
function ui(){$('w').textContent=Math.floor(S.w);$('s').textContent=Math.floor(S.s);$('r').textContent=S.skills.has('acid')?Math.max(S.r,Math.floor(S.s*.25)):0;$('m').textContent=S.skills.has('medic')?Math.max(S.m,2):0;$('f').textContent=Math.floor(S.f);$('tp').textContent=$('tp2').textContent=S.tp;$('day').textContent='Day '+S.day;$('ratioTxt').textContent=Math.round(S.ratio*100)+'%';$('boost').textContent='🍄 '+Math.floor(S.boost)+' → 快速培育 +'+(S.skills.has('brood')?15:10);tech.forEach(k=>{let e=$('k'+k[0]);if(e){e.classList.toggle('owned',S.skills.has(k[0]));e.disabled=S.skills.has(k[0])||!can(k)}});$('armyInfo').innerHTML=`<div class="partner"><b>前排兵蟻 ${S.s}</b><div class="muted">近戰、承傷、包圍。</div></div><div class="partner"><b>🏹 酸液兵 ${S.skills.has('acid')?Math.max(S.r,Math.floor(S.s*.25)):0}</b><div class="muted">${S.skills.has('acid')?'已解鎖：保持距離自動射擊。':'研究「酸液兵」後解鎖遠程戰鬥。'}</div></div><div class="partner"><b>🩹 醫護蟻 ${S.skills.has('medic')?Math.max(S.m,2):0}</b><div class="muted">${S.skills.has('medic')?'自動尋找受傷友軍治療。':'研究「醫護工蟻」後解鎖回血。'}</div></div>`;let pk=Object.keys(S.partners);$('partners').innerHTML=(pk.length?pk.map(k=>`<div class="partner"><b>${enemies[k]?.icon||'•'} ${enemies[k]?.name||k} ×${S.partners[k]}</b><div class="muted">共生已解鎖專屬科技。</div></div>`).join(''):'<div class="partner muted">尚未收服共生生物。</div>')+Object.keys(S.samples).map(k=>`<div class="partner"><b>🧪 ${enemies[k]?.name} 樣本 ${S.samples[k]}/3</b><div class="muted">${S.samples[k]>=3?'已可研究仿生科技':'繼續狩獵以完成研究'}</div></div>`).join('');$('heroes').innerHTML=S.heroes.map(h=>`<div class="hero"><b>⭐ ${h.name} Lv.${h.lv}</b><div class="muted">XP ${h.xp} · 擊殺 ${h.k}</div></div>`).join('');draw()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{['colony','tech','army','sym','hero'].forEach(x=>$(x).classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden')});$('ratio').oninput=e=>{S.ratio=e.target.value/100;ui()};$('pause').onclick=()=>{S.paused=!S.paused;$('pause').textContent=S.paused?'繼續':'暫停'};$('speed').onclick=()=>{S.spd=S.spd===1?2:S.spd===2?4:1;$('speed').textContent='×'+S.spd};buildTree();for(let i=0;i<5;i++)spawn();setInterval(sim,200);setInterval(battleStep,120);addEventListener('resize',draw);ui()})();
</script></body></html>
