<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>蟻后 REBORN v0.20</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0e120c;color:#eee6d3;font-family:-apple-system,"Noto Sans TC",sans-serif}header{position:sticky;top:0;z-index:5;background:#151a11;padding:10px;display:flex;gap:8px;overflow:auto;border-bottom:1px solid #5d5638}.p{background:#252b1d;border:1px solid #5b5b3e;border-radius:10px;padding:7px;white-space:nowrap}nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#12160f;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:7px}button{background:#2b311f;color:#eee6d3;border:1px solid #706b48;border-radius:9px;padding:9px;font-weight:700}.page{display:none;padding:14px 14px 85px}.page.on{display:block}#worldPage{padding:0 0 75px;height:calc(100vh - 55px);position:relative}canvas{width:100%;height:100%;display:block}.hud{position:absolute;background:#11160edc;border:1px solid #625d3d;border-radius:13px;padding:10px;backdrop-filter:blur(8px)}#place{left:10px;top:10px}#colony{right:10px;top:10px;width:210px}#event{left:10px;bottom:85px;max-width:330px}.rates{display:flex;gap:4px;margin-top:6px}.rates span{background:#282c1e;padding:5px;border-radius:6px;font-size:11px}.muted{color:#aaa38f;font-size:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.card,.tree{background:#1b2117;border:1px solid #52543a;border-radius:13px;padding:11px}.skilltop{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.trees{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:10px;min-width:720px;overflow:auto}.node{display:block;width:100%;text-align:left;margin:7px 0}.locked{opacity:.38}.max{border-color:#d8b653}.line{height:12px;border-left:2px solid #6b6240;margin-left:18px}.hero{border-left:4px solid #d87824}.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.slot{border:1px dashed #68624a;border-radius:7px;padding:5px;min-height:48px;font-size:10px}.magic{border-left:4px solid #4c83ff}.rare{border-left:4px solid #e6c63d}.set{border-left:4px solid #4bc76b}.unique{border-left:4px solid #bd8740}.charm{border-left:4px solid #a65dff}@media(max-width:700px){nav button{font-size:9px;padding:7px 1px}.hud{font-size:11px}#colony{width:175px}}</style></head><body>
<header><div class="p">🌿 <b id="r0">30</b></div><div class="p">🦷 顎晶 <b id="r1">1</b></div><div class="p">🎯 腺晶 <b id="r2">0</b></div><div class="p">✨ 靈質 <b id="r3">0</b></div><div class="p">🐜 <b id="pop">11</b></div><div class="p">技能 <b id="sp">1</b>/100</div></header>
<section id="worldPage" class="page on"><canvas id="world"></canvas><div id="place" class="hud"><b id="pn"></b><div class="rates"><span id="pp0"></span><span id="pp1"></span><span id="pp2"></span><span id="pp3"></span></div><div class="muted">視野 <b id="vis"></b>m · 遠處被迷霧覆蓋</div></div><div id="colony" class="hud"><b>蟻群</b><div>工蟻 <b id="w"></b> · 兵蟻 <b id="s"></b></div><div class="muted">工蟻自動採集；點地表資源手動拾取；點生物指定攻擊。</div><button id="egg">🥚 產卵 ×10 · 🌿 <span id="ec"></span></button><div class="muted">60秒內連續產卵：10→20→40→80→160…</div></div><div id="event" class="hud">蟻后在世界邊緣建立了第一座巢穴。</div></section>
<section id="skillPage" class="page"><h2>技能書</h2><div class="muted">三職業 × 三頁；每技能最高20級；總技能點上限100。用對應特化資源換技能點。</div><div id="skilltop" class="skilltop"></div><div id="book"></div></section>
<section id="heroPage" class="page"><h2>英雄蟻 · 最多3隻</h2><div id="heroes"></div></section>
<section id="lootPage" class="page"><h2>戰利品</h2><div class="muted">藍1詞綴｜黃2詞綴｜綠套裝｜暗金特殊能力｜紫色巢穴護符</div><div id="loot"></div></section>
<section id="movePage" class="page"><h2>遷移巢穴</h2><div id="places" class="cards"></div></section>
<section id="statsPage" class="page"><h2>蟻群</h2><div id="stats" class="cards"></div></section>
<nav><button data-p="worldPage">🌍世界</button><button data-p="skillPage">📖技能</button><button data-p="heroPage">👑英雄</button><button data-p="lootPage">💎裝備</button><button data-p="movePage">🪹遷巢</button><button data-p="statsPage">📊蟻群</button></nav>
<script>
const $=x=>document.getElementById(x);
const places=[['枯葉林緣',0,[.8,.1,.05,.05],'安全而貧瘠'],['碎石溪岸',80,[.58,.22,.15,.05],'近戰資源增加'],['高草獵場',180,[.45,.15,.3,.1],'遠距資源豐富'],['雷擊腐木',350,[.34,.16,.15,.35],'魔法資源富集'],['古樹根城',650,[.3,.25,.22,.23],'後期富饒地帶']];
const pages={melee:[['巨顎',[['硬化大顎',0,'近戰傷害'],['連續撕咬',3,'連擊'],['處決本能',8,'斬殺'],['狂戰費洛蒙',13,'擊殺加速']]],['護衛',[['甲殼強化',0,'生命'],['護衛陣',4,'保護英雄'],['反擊棘刺',9,'反傷'],['不屈蟻潮',14,'低血減傷']]],['神速',[['迅捷足節',0,'移速'],['二連擊',3,'追加攻擊'],['殘影突襲',8,'切後排'],['百裂',14,'多段連擊']]]],range:[['酸液',[['酸液腺',0,'解鎖酸液兵'],['腐蝕彈',3,'破甲'],['酸霧',8,'範圍傷害'],['溶甲洪流',14,'群體破甲']]],['狙擊',[['感知觸角',0,'射程'],['弱點瞄準',4,'暴擊'],['穿透射擊',9,'穿透'],['致命腺針',15,'Boss單體']]],['蛛絲',[['黏液絲',0,'緩速'],['蛛網束縛',4,'定身'],['震動定位',9,'命中與視野'],['天羅地網',15,'群體控制']]]],magic:[['雷霆',[['電荷腺體',0,'放電'],['連鎖閃電',4,'彈跳'],['雷暴',10,'區域落雷'],['雷神蟻',16,'雷霆化身']]],['烈焰',[['燃燒酸',0,'燃燒'],['爆燃',4,'死亡爆炸'],['火焰噴射',10,'錐形攻擊'],['火海',16,'燃燒區域']]],['生命',[['菌絲癒合',0,'回血'],['戰地拖救',4,'救援'],['群體再生',10,'群補'],['靈魂寄宿',16,'跨周目']]]]};
const cn={melee:'🦷近戰',range:'🎯遠距',magic:'✨魔法'};
let S={r:30,x:{melee:1,range:0,magic:0},w:8,s:2,loc:0,vis:32,chain:0,lastEgg:0,spent:1,free:{melee:0,range:0,magic:0},sk:{},heroes:[{name:'赤顎',c:'melee',lv:1,xp:0,e:{}}],loot:[],kills:0,t:0};
Object.keys(pages).forEach(c=>pages[c].forEach(p=>p[1].forEach((q,i)=>S.sk[c+':'+p[0]+':'+i]=0)));S.sk['melee:巨顎:0']=1;
let ents=[],cls='melee',last=performance.now();
function log(t){$('event').innerHTML=t+'<br>'+$('event').innerHTML.slice(0,300)}
function eggCost(){if(performance.now()-S.lastEgg>60000)S.chain=0;return 10*2**S.chain}
function roll(m=1){let q=Math.random(),p=places[S.loc][2];if(q<p[0])S.r+=Math.ceil(3*m);else if(q<p[0]+p[1])S.x.melee+=Math.ceil(m);else if(q<p[0]+p[1]+p[2])S.x.range+=Math.ceil(m);else S.x.magic+=Math.ceil(m)}
function spawn(){let cr=Math.random()<.32,a=Math.random()*6.283,d=10+Math.random()*S.vis*.8;ents.push({cr,x:50+Math.cos(a)*d,y:50+Math.sin(a)*d,hp:cr?8+S.loc*10:1,name:['蟑螂','蜘蛛','甲蟲','螳螂','蜈蚣'][Math.min(4,S.loc+Math.floor(Math.random()*2))]})}
function lootRoll(){let r=Math.random(),rar=r<.006?'unique':r<.018?'set':r<.04?'charm':r<.10?'rare':r<.24?'magic':null;if(!rar)return;let slots=['頭盔','胸甲','武器','副手','腰帶','手套','鞋子','護身符','戒指','戒指'],n={magic:'魔法',rare:'稀有',set:'套裝',unique:'暗金',charm:'護符'};let o={rar,name:n[rar]+'·'+['蟻顎','甲片','觸角','菌絲'][Math.floor(Math.random()*4)],slot:rar==='charm'?'巢穴':slots[Math.floor(Math.random()*slots.length)]};S.loot.unshift(o);log('💎 '+o.name+' 掉落')}
function attack(e){if(!S.s)return log('沒有兵蟻');let loss=Math.min(S.s,Math.floor(Math.random()*e.hp/(S.s+2)));S.s-=loss;ents=ents.filter(q=>q!==e);S.kills++;roll(2+S.loc);lootRoll();S.heroes.forEach(h=>h.xp+=4+S.loc*2);log(`⚔️ 擊殺${e.name}，損失${loss}兵蟻`);ui()}
$('egg').onclick=()=>{let c=eggCost();if(S.r<c)return log('主資源不足');S.r-=c;S.chain++;S.lastEgg=performance.now();let w=Math.floor(Math.random()*11);S.w+=w;S.s+=10-w;log(`🥚 工蟻${w}、兵蟻${10-w}`);ui()};
function buyPoint(c){let cost=3+Math.floor((S.spent-1)/4)*2;if(S.spent>=100)return log('技能點已達100');if(S.x[c]<cost)return log('特化資源不足，需要'+cost);S.x[c]-=cost;S.spent++;S.free[c]++;renderSkills();ui()}
function add(c,pi,i){let p=pages[c][pi],k=c+':'+p[0]+':'+i,lv=S.sk[k];if(lv>=20||!S.free[c])return;if(i&&(!(S.sk[c+':'+p[0]+':'+(i-1)])||S.spent<p[1][i][1]))return;S.free[c]--;S.sk[k]++;renderSkills();ui()}
function renderSkills(){$('skilltop').innerHTML=Object.keys(pages).map(c=>`<button onclick="cls='${c}';renderSkills()">${cn[c]} 資源${S.x[c]} 可用點${S.free[c]}</button>`).join('');$('book').innerHTML=`<button onclick="buyPoint('${cls}')">兌換1技能點</button><div class="trees">${pages[cls].map((p,pi)=>`<div class="tree"><h3>${p[0]}</h3>${p[1].map((q,i)=>{let lv=S.sk[cls+':'+p[0]+':'+i],lock=i&&(!(S.sk[cls+':'+p[0]+':'+(i-1)])||S.spent<q[1]);return `${i?'<div class=line></div>':''}<button class="node ${lock?'locked':''} ${lv===20?'max':''}" onclick="add('${cls}',${pi},${i})"><b>${q[0]}</b> Lv.${lv}/20<br><span class=muted>${q[2]}${i?' · 需求'+q[1]:''}</span></button>`}).join('')}</div>`).join('')}</div>`}
function renderHeroes(){$('heroes').innerHTML=S.heroes.map(h=>`<div class="card hero"><h3>🐜 ${h.name} · ${cn[h.c]}英雄</h3><div>Lv.${h.lv} XP ${h.xp}</div><div class=slots>${['頭盔','胸甲','武器','副手','腰帶','手套','鞋子','護身符','戒指1','戒指2'].map(s=>`<div class=slot>${s}<br>—</div>`).join('')}</div></div>`).join('')}
function renderLoot(){$('loot').innerHTML=S.loot.length?S.loot.map(o=>`<div class="card ${o.rar}"><b>${o.name}</b> · ${o.slot}</div>`).join(''):'尚無裝備'}
function renderPlaces(){$('places').innerHTML=places.map((p,i)=>`<div class=card><h3>${p[0]}</h3><div>${p[3]}</div><div class=rates>${['🌿','🦷','🎯','✨'].map((x,j)=>`<span>${x}${p[2][j]*100}%</span>`).join('')}</div><button ${i===S.loc||S.r<p[1]?'disabled':''} onclick="move(${i})">${i===S.loc?'目前位置':'遷移 🌿'+p[1]}</button></div>`).join('')}
function move(i){if(S.r<places[i][1])return;S.r-=places[i][1];S.loc=i;S.vis=32+i*7;ents=[];for(let n=0;n<14;n++)spawn();log('🪹 遷移到'+places[i][0]);ui()}
function ui(){let p=places[S.loc];$('r0').textContent=Math.floor(S.r);$('r1').textContent=S.x.melee;$('r2').textContent=S.x.range;$('r3').textContent=S.x.magic;$('pop').textContent=S.w+S.s+1;$('sp').textContent=S.spent;$('w').textContent=S.w;$('s').textContent=S.s;$('ec').textContent=eggCost();$('pn').textContent=p[0];$('vis').textContent=S.vis;for(let i=0;i<4;i++)$('pp'+i).textContent=['🌿','🦷','🎯','✨'][i]+Math.round(p[2][i]*100)+'%';$('stats').innerHTML=`<div class=card><h3>工蟻 ${S.w}</h3>自動主資源 +${(S.w*.045).toFixed(2)}/秒</div><div class=card><h3>兵蟻 ${S.s}</h3>提高戰鬥群體能力</div><div class=card><h3>擊殺 ${S.kills}</h3>英雄 ${S.heroes.length}/3</div>`}
function draw(){let c=$('world'),d=Math.min(2,devicePixelRatio||1),w=c.clientWidth,h=c.clientHeight;if(c.width!=w*d||c.height!=h*d){c.width=w*d;c.height=h*d}let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);let g=x.createRadialGradient(w/2,h/2,10,w/2,h/2,Math.min(w,h)*.6);g.addColorStop(0,'#40502d');g.addColorStop(1,'#080b07');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='#382619';x.beginPath();x.arc(w/2,h/2,26,0,7);x.fill();x.fillStyle='#d9b96e';x.font='22px sans-serif';x.fillText('♛',w/2-10,h/2+7);ents.forEach(e=>{let px=e.x*w/100,py=e.y*h/100;if(!e.cr){x.shadowBlur=12;x.shadowColor='#b9ff78';x.fillStyle='#b6dc6c';x.beginPath();x.ellipse(px,py,7,4,-.5,0,7);x.fill();x.shadowBlur=0}else{x.fillStyle='#4d2819';x.strokeStyle='#c48e57';x.beginPath();x.ellipse(px,py,12,7,0,0,7);x.fill();x.stroke();for(let j=-1;j<2;j++){x.beginPath();x.moveTo(px-4,py+j*4);x.lineTo(px-15,py+j*7);x.stroke();x.beginPath();x.moveTo(px+4,py+j*4);x.lineTo(px+15,py+j*7);x.stroke()}}})}
$('world').onclick=e=>{let r=e.target.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*100,my=(e.clientY-r.top)/r.height*100,b=null,bd=5;ents.forEach(q=>{let d=Math.hypot(q.x-mx,q.y-my);if(d<bd){b=q;bd=d}});if(!b)return;if(b.cr)attack(b);else{roll();ents=ents.filter(q=>q!==b);spawn();log('✋ 手動拾取資源');ui()}};
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));$(b.dataset.p).classList.add('on');if(b.dataset.p==='skillPage')renderSkills();if(b.dataset.p==='heroPage')renderHeroes();if(b.dataset.p==='lootPage')renderLoot();if(b.dataset.p==='movePage')renderPlaces();ui()});
for(let i=0;i<14;i++)spawn();function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;S.t+=dt;S.r+=S.w*.045*dt;if(Math.random()<dt*.12&&ents.length<20)spawn();draw();if((S.t*2|0)%2===0)ui();requestAnimationFrame(loop)}renderSkills();ui();requestAnimationFrame(loop);
</script></body></html>
